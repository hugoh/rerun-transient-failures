[tools]
hk = "2.4.0"
uv = "0.12.22"
actionlint = "1.7.12"
pinact = "4.1.1"
zizmor = "1.30.1"
ghalint = "1.5.6"
gitleaks = "8.30.1"
typos = "1.50.3"
rumdl = "0.2.78"
shellcheck = "0.11.0"
"aqua:anordal/shellharden" = "4.3.2"
shfmt = "3.14.1"
biome = "2.5.10"
tombi = "1.5.5"
"github:owenlamont/ryl" = "0.21.0"
"github:tj-actions/auto-doc" = "3.6.0"
ruff = "0.16.10"
ty = "0.0.84"

[tasks.test]
description = "Run the transient-detection test suite"
run = "python3 -m unittest discover -p 'test_*.py'"

[tasks.gen]
description = "Regenerate the README Inputs/Outputs tables from action.yml"
run = [
  "auto-doc --filename action.yml --output README.md --inputColumns Input --inputColumns Required --inputColumns Default --inputColumns Description --outputColumns Output --outputColumns Description --colMaxWords 100",
  "rumdl check --fix README.md",
]

[tasks.gen-check]
description = "Verify the README API tables are in sync with action.yml"
run = """
before=$(shasum -a 256 README.md | cut -d' ' -f1)
mise run gen
after=$(shasum -a 256 README.md | cut -d' ' -f1)
[ "$before" = "$after" ] || { echo 'README.md is out of date — run: mise run gen'; exit 1; }
"""
